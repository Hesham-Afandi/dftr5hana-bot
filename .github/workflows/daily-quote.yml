name: 📚 نشر اقتباس يومي

on:
  schedule:
    - cron: "0 17 * * *"  # كل يوم 5 مساءً UTC (8 مساءً السعودية)
  workflow_dispatch:  # للتشغيل اليدوي

jobs:
  send-quote:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 جلب الكود
        uses: actions/checkout@v4

      - name: 🐍 تثبيت بايثون
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 📦 تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: 🤖 تشغيل البوت
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py
