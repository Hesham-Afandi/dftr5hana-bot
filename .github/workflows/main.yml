name: بيت الأرملة السوداء

on:
  schedule:
    # كل يوم الساعة 4 مساءً بتوقيت القاهرة (14:00 UTC)
    - cron: '0 14 * * *'
  workflow_dispatch: # للتشغيل اليدوي للاختبار

jobs:
  send-daily-quote:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 سحب الكود
        uses: actions/checkout@v4
        
      - name: 🐍 إعداد بايثون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 📦 تثبيت المكتبات
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: 🎨 تحميل الخطوط
        run: |
          mkdir -p fonts
          
          # تحميل خط Amiri من GitHub Releases
          echo "⏳ جاري تحميل خط Amiri..."
          curl -L "https://github.com/alif-type/amiri/releases/download/v0.112/Amiri-regular.ttf" -o fonts/Amiri-Regular.ttf || \
          curl -L "https://raw.githubusercontent.com/alif-type/amiri/master/fonts/Amiri-Regular.ttf" -o fonts/Amiri-Regular.ttf || \
          curl -L "https://cdn.jsdelivr.net/gh/alif-type/amiri@v0.112/fonts/Amiri-Regular.ttf" -o fonts/Amiri-Regular.ttf
          
          # تحميل خط Aref Ruqaa
          echo "⏳ جاري تحميل خط Aref Ruqaa..."
          curl -L "https://github.com/google/fonts/raw/main/ofl/arefruqaa/ArefRuqaa%5Bwght%5D.ttf" -o fonts/ArefRuqaa-Regular.ttf || \
          curl -L "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/arefruqaa/ArefRuqaa[wght].ttf" -o fonts/ArefRuqaa-Regular.ttf
          
          # التأكد من وجود الخطوط
          echo "📋 الملفات في مجلد fonts:"
          ls -la fonts/
          
          # لو الخطوط مش اتحملت، استخدم خطوط النظام
          if [ ! -f "fonts/Amiri-Regular.ttf" ]; then
            echo "⚠️ خط Amiri مش متوفر، هتستخدم خط بديل..."
            sudo apt-get update
            sudo apt-get install -y fonts-amiri
            mkdir -p fonts
            cp /usr/share/fonts/truetype/amiri/Amiri-Regular.ttf fonts/Amiri-Regular.ttf 2>/dev/null || \
            cp /usr/share/fonts/truetype/amiri/amiri.ttf fonts/Amiri-Regular.ttf 2>/dev/null || \
            echo "❌ مافيش خطوط Amiri"
          fi
          
          if [ ! -f "fonts/ArefRuqaa-Regular.ttf" ]; then
            echo "⚠️ خط Aref Ruqaa مش متوفر، هتستخدم خط بديل..."
            # استخدم خط Droid Arabic Naskh كبديل
            sudo apt-get install -y fonts-droid-arabic || true
          fi
          
          echo "✅ الخطوط جاهزة!"
          
      - name: 🤖 تشغيل البوت
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python main.py
        
      - name: 🧹 تنظيف (اختياري)
        if: always()
        run: rm -f daily_quote.jpg
